[package]
name = "md-viewer-pro"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "MD Viewer Pro — a fast native Markdown viewer/editor built with Rust and Tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mdv-core = { path = "../../crates/mdv-core" }
rfd = "0.15"
dirs = "6"
open = "5"
arboard = "3"
lopdf = "0.46"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSURL", "NSDictionary"] }
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBitmapImageRep", "NSGraphics"] }
objc2-web-kit = { version = "0.3", features = ["WKSnapshotConfiguration", "WKWebView"] }
block2 = "0.6"
