<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MD Viewer Pro</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="assets/katex/katex.min.css">
</head>
<body data-mode="view" data-page="free">
<div id="app">
  <header id="main-toolbar" class="toolbar">
    <div class="tb-left">
      <button id="btn-back" class="flat-btn" title="戻る" data-i18n="back">戻る</button>
      <span class="tb-sep"></span>
      <div id="mode-seg" class="flat-group" role="tablist">
        <button data-mode="view" class="flat-btn" data-i18n="view" role="tab">閲覧</button>
        <button data-mode="md" class="flat-btn" data-i18n="md_edit" role="tab">MD編集</button>
        <button data-mode="txt" class="flat-btn" data-i18n="txt_edit" role="tab">TXT編集</button>
      </div>
      <span class="tb-sep"></span>
      <div id="page-seg" class="flat-group">
        <button data-page="free" class="flat-btn" data-i18n="free">フリー</button>
        <button data-page="a4" class="flat-btn" data-i18n="a4">A4文書</button>
      </div>
      <span class="tb-sep"></span>
      <button id="btn-margin" class="flat-btn" data-i18n="margin">余白設定</button>
      <span class="tb-sep"></span>
      <span class="scale-label" data-i18n="scale">スケール</span>
      <input id="scale-range" class="scale-range" type="range" min="0" max="4" step="1" value="2">
      <span id="scale-val" class="scale-val">100%</span>
      <span class="tb-sep"></span>
      <button id="btn-settings" class="flat-btn" data-i18n="settings">詳細設定</button>
      <span class="tb-sep"></span>
      <button id="btn-toc" class="flat-btn" data-i18n="toc_title">目次</button>
      <button id="btn-clip" class="flat-btn" data-i18n="clip_title">クリップ</button>
      <span class="tb-sep"></span>
      <button id="btn-pdf" class="flat-btn" data-i18n="pdf_export">PDF書き出し</button>
    </div>
  </header>

  <div id="fmt-toolbar" class="fmt-toolbar" hidden>
    <div class="fmt-group">
      <button data-fmt="bold" title="太字 (Cmd+B)"><b>B</b></button>
      <button data-fmt="italic" title="斜体 (Cmd+I)"><i>I</i></button>
      <button data-fmt="strike" title="打ち消し">~~</button>
      <button data-fmt="code" title="コード" data-i18n="fmt_code">コード</button>
    </div>
    <span class="fmt-sep"></span>
    <div class="fmt-group">
      <button data-fmt="h1">H1</button>
      <button data-fmt="h2">H2</button>
      <button data-fmt="h3">H3</button>
      <button data-fmt="body" data-i18n="fmt_body">本文</button>
    </div>
    <span class="fmt-sep"></span>
    <div class="fmt-group">
      <button data-fmt="list" data-i18n="fmt_list">リスト</button>
      <button data-fmt="num" data-i18n="fmt_num">番号</button>
      <button data-fmt="check" data-i18n="fmt_check">チェック</button>
      <button data-fmt="quote" data-i18n="fmt_quote">引用</button>
      <button data-fmt="hr" data-i18n="fmt_hr">水平線</button>
    </div>
    <span class="fmt-sep"></span>
    <div class="fmt-group">
      <button data-fmt="link" data-i18n="fmt_link">リンク</button>
      <button data-fmt="image" data-i18n="fmt_img">画像</button>
      <button data-fmt="table" data-i18n="fmt_table">テーブル</button>
    </div>
  </div>

  <main id="workspace">
    <aside id="toc-panel" class="side-panel">
      <div class="panel-head" data-i18n="toc_title">目次</div>
      <div id="toc-list" class="toc-list"></div>
    </aside>

    <section id="editor-pane" class="pane" hidden>
      <div class="editor-wrap">
        <div id="gutter" class="gutter" aria-hidden="true"></div>
        <textarea id="editor" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
      </div>
    </section>

    <section id="preview-pane" class="pane">
      <div id="find-bar" class="find-bar" hidden>
        <input id="find-input" type="search" placeholder="検索" autocomplete="off">
        <span id="find-count" class="find-count"></span>
        <button id="find-next" class="mini-btn" title="次へ">↓</button>
        <button id="find-close" class="mini-btn" title="閉じる">×</button>
      </div>
      <div id="doc-scroll" class="doc-scroll">
        <article id="doc" class="markdown-body"></article>
      </div>
    </section>

    <aside id="clip-panel" class="side-panel clip-panel" hidden>
      <div class="panel-head">
        <span data-i18n="clip_title">クリップ</span>
        <button id="clip-add" class="mini-btn" data-i18n="clip_add">＋追加</button>
      </div>
      <div id="clip-list" class="clip-list"></div>
    </aside>
  </main>

  <div id="drop-overlay" class="drop-overlay" hidden>
    <div class="drop-box">ここにファイルをドロップ</div>
  </div>

  <dialog id="startup-dialog" class="modal startup">
    <div class="modal-body">
      <h2 data-i18n="startup_title">MD Viewer Pro</h2>
      <p class="startup-hint" data-i18n="startup_hint">Markdown ファイルを開くか、新規作成してください。</p>
      <button id="startup-open" class="startup-btn" data-i18n="startup_open">ファイルを開く</button>
      <button id="startup-new" class="startup-btn" data-i18n="startup_new">新規作成</button>
      <div class="startup-lang">
        <label for="startup-lang" data-i18n="startup_language">Language</label>
        <select id="startup-lang">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="zh">简体中文</option>
        </select>
      </div>
      <button id="startup-guide" class="startup-btn" data-i18n="startup_guide">説明を開く</button>
    </div>
  </dialog>

  <dialog id="pdf-dialog" class="modal">
    <form method="dialog" class="modal-body">
      <h2 data-i18n="pdf_settings_title">PDF書き出し設定</h2>
      <div class="field">
        <label data-i18n="pdf_orientation">方向</label>
        <select id="pdf-orientation">
          <option value="portrait" data-i18n="pdf_portrait">縦向き</option>
          <option value="landscape" data-i18n="pdf_landscape">横向き</option>
        </select>
      </div>
      <div class="field column">
        <label data-i18n="margin_title">余白 (mm)</label>
        <div class="margin-grid">
          <label>上 <input id="pdf-m-top" type="number" min="0" max="60" step="1"></label>
          <label>右 <input id="pdf-m-right" type="number" min="0" max="60" step="1"></label>
          <label>下 <input id="pdf-m-bottom" type="number" min="0" max="60" step="1"></label>
          <label>左 <input id="pdf-m-left" type="number" min="0" max="60" step="1"></label>
        </div>
      </div>
      <div class="field">
        <label data-i18n="pdf_embed_images_label">画像を含める</label>
        <input id="pdf-images" type="checkbox">
      </div>
      <div class="field">
        <label data-i18n="pdf_style_mode">スタイル</label>
        <select id="pdf-style"></select>
      </div>
      <div class="modal-actions">
        <button value="cancel" class="text-btn" data-i18n="cancel">キャンセル</button>
        <button value="ok" class="primary" data-i18n="ok">OK</button>
      </div>
    </form>
  </dialog>

  <dialog id="settings-dialog" class="modal">
    <form method="dialog" class="modal-body">
      <h2 data-i18n="settings_title">詳細設定</h2>
      <div class="field">
        <label for="set-lang" data-i18n="lang_label">言語</label>
        <select id="set-lang">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="zh">简体中文</option>
        </select>
      </div>
      <div class="field">
        <label for="set-theme" data-i18n="theme_label">テーマ</label>
        <select id="set-theme">
          <option value="dark" data-i18n="dark">ダークモード</option>
          <option value="light" data-i18n="light">ライトモード</option>
          <option value="system">システム</option>
        </select>
      </div>
      <div class="field">
        <label data-i18n="theme_color_label">テーマ色</label>
        <div id="accent-swatches" class="swatches"></div>
      </div>
      <div class="field">
        <label for="set-font" data-i18n="font_label">フォント</label>
        <select id="set-font"></select>
      </div>
      <div class="field">
        <label for="set-fontsize">文字サイズ</label>
        <div class="range-wrap">
          <input id="set-fontsize" type="range" min="12" max="28" step="1">
          <span id="set-fontsize-val"></span>
        </div>
      </div>
      <div class="field inline">
        <label for="set-bold" data-i18n="bold_label">テキスト太字強調</label>
        <input id="set-bold" type="checkbox">
      </div>
      <div class="field column inline">
        <label for="set-hardbreaks" data-i18n="hard_breaks_cb">改行をそのまま改行として表示する</label>
        <input id="set-hardbreaks" type="checkbox">
        <p class="hint" data-i18n="hard_breaks_hint"></p>
      </div>
      <div class="field">
        <label data-i18n="plugin_label">プラグインテーマ</label>
        <button id="btn-theme-dir" type="button" class="text-btn" data-i18n="plugin_dir_btn">テーマフォルダを開く</button>
      </div>
      <div class="field">
        <label data-i18n="font_add">フォント追加</label>
        <div class="btn-row">
          <button id="btn-font-add" type="button" class="text-btn">TTF / OTF を追加</button>
          <button id="btn-font-remove" type="button" class="text-btn" data-i18n="font_remove">削除</button>
        </div>
      </div>
      <div class="modal-actions">
        <button value="cancel" class="text-btn" data-i18n="cancel">キャンセル</button>
        <button value="ok" class="primary" data-i18n="ok">OK</button>
      </div>
    </form>
  </dialog>

  <dialog id="margin-dialog" class="modal">
    <form method="dialog" class="modal-body">
      <h2 data-i18n="margin_title">A4余白設定 (mm)</h2>
      <div class="margin-grid">
        <label>上 <input id="m-top" type="number" min="0" max="80" step="1"></label>
        <label>右 <input id="m-right" type="number" min="0" max="80" step="1"></label>
        <label>下 <input id="m-bottom" type="number" min="0" max="80" step="1"></label>
        <label>左 <input id="m-left" type="number" min="0" max="80" step="1"></label>
      </div>
      <div class="modal-actions">
        <button value="cancel" class="text-btn" data-i18n="cancel">キャンセル</button>
        <button value="ok" class="primary" data-i18n="ok">OK</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
</div>
<script src="assets/katex/katex.min.js"></script>
<script src="assets/katex/auto-render.min.js"></script>
<script src="assets/hljs/highlight.min.js"></script>
<script src="assets/mermaid/mermaid.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
