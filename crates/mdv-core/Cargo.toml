[package]
name = "mdv-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Markdown document core for MD Viewer Pro (parsing, rendering, settings, themes)"

[dependencies]
comrak = { version = "0.59", default-features = false }
ammonia = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
encoding_rs = "0.8"
chardetng = "1"

[dev-dependencies]
tempfile = "3"
